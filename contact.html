            <p style="margin: 10px 0;">

    <!-- Js file for maps -->
    <script src="maps.js"></script>

    <!-- Particles Configrations -->
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80 }, 
                "color": { "value": "#D4F1F4"}, 
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4 },
                "size": { "value": 5 }, 
                "line_linked": {
                    "enable": true, "distance": 170, "color": "#000000", "opacity": 0.3, "width": 1
                },
                "move": { "enable": true, "speed": 2, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "grab" }, 
                    "onclick": { "enable": true, "mode": "push" } 
                }
            },
            "retina_detect": true
        });
    </script>
